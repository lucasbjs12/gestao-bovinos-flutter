name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar sqlite (necessário para os testes de repositório)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Os passos abaixo só rodam se o secret GOOGLE_SERVICES_JSON estiver
      # configurado no repositório (Settings > Secrets and variables > Actions).
      - name: Restaurar google-services.json
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Build APK debug
        if: env.GOOGLE_SERVICES_JSON != ''
        run: flutter build apk --debug

      - name: Publicar APK como artefato
        if: env.GOOGLE_SERVICES_JSON != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestaobovinos
          POSTGRES_PASSWORD: gestaobovinos
          POSTGRES_DB: gestaobovinos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Mesmo banco serve pra DATABASE_URL e DATABASE_URL_TEST aqui -- o
      # test/setup.ts já garante que os testes só rodam contra a URL de
      # teste, e no CI não existe um banco de dev separado pra proteger.
      DATABASE_URL: postgresql://gestaobovinos:gestaobovinos@localhost:5432/gestaobovinos_test?schema=public
      DATABASE_URL_TEST: postgresql://gestaobovinos:gestaobovinos@localhost:5432/gestaobovinos_test?schema=public
      JWT_ACCESS_SECRET: ci-segredo-de-teste-nao-usar-em-producao
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 30
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      # `npm run lint` fica de fora por enquanto -- não existe configuração
      # de ESLint no projeto (falta o arquivo de config), então roda quebrado
      # até localmente. Ver eslint.config.js/.eslintrc antes de religar aqui.

      - run: npm run typecheck

      - run: npm test
